  <!-- 眼睛 -->
  <circle cx="24" cy="33" r="4" fill="#d97757"/>
  <circle cx="40" cy="33" r="4" fill="#d97757"/>
  <circle cx="24" cy="33" r="1.5" fill="#fff"/>
  <circle cx="40" cy="33" r="1.5" fill="#fff"/>

  <!-- 嘴巴 -->
