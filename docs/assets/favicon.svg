<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 圆角背景 -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#d97757"/>

  <!-- 机器人天线 -->
